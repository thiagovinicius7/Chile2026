name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Separar os arquivos do site
        run: |
          mkdir _site
          cp index.html app.js config.js style.css logo.webp icone-192.png apple-touch-icon.png _site/
          touch _site/.nojekyll
          # Cada publicação ganha uma versão nova, para o navegador não usar arquivos antigos.
          V="${GITHUB_SHA::8}"
          sed -i "s#src=\"app.js\"#src=\"app.js?v=$V\"#; s#href=\"style.css\"#href=\"style.css?v=$V\"#" _site/index.html
          sed -i "s#from \"./config.js\"#from \"./config.js?v=$V\"#" _site/app.js
          grep -c "v=$V" _site/index.html _site/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # O GitHub às vezes não acha o pacote na primeira tentativa: espera e tenta de novo.
      - if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
